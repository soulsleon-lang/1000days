<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1000 Days Journey — Anniversary Scroll</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 65%, #060a14 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .game-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 13.5px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
    }

    .hud-val {
      font-size: 15px;
      font-weight: 800;
      color: #fbbf24;
    }

    .hud-val.speed-val {
      color: #38bdf8;
    }

    .hud-val.streak-val {
      color: #4ade80;
    }

    .status-banner {
      min-height: 34px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 12px;
      padding: 7px 14px;
      font-size: 12.5px;
      color: #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shield-pill {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 99px;
      white-space: nowrap;
      display: none;
    }

    .shield-pill.active {
      display: inline-block;
    }

    canvas {
      width: 100%;
      height: 365px;
      border-radius: 20px;
      display: block;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      touch-action: manipulation;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button.main-btn {
      flex: 1;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.6px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.15s ease;
    }

    button.start-btn {
      color: #0f172a;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    button.start-btn:active {
      transform: translateY(2px);
    }

    button.jump-btn {
      color: #f8fafc;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
    }

    button.jump-btn:active {
      transform: translateY(2px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 20;
      overflow-y: auto;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(180deg, #162032 0%, #0f172a 100%);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.65);
    }

    .modal-title {
      font-size: 22px;
      font-weight: 900;
      color: #fbbf24;
      margin-bottom: 10px;
    }

    .modal-text {
      font-size: 14.5px;
      line-height: 1.65;
      color: #cbd5e1;
      margin-bottom: 22px;
    }

    /* ANNIVERSARY SCROLL CARD */
    .scroll-card {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(180deg, #fef3c7 0%, #fde68a 48%, #f5d08a 100%);
      color: #3b2314;
      border: 2px solid #b45309;
      border-radius: 22px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 0 24px rgba(180, 83, 9, 0.22);
      position: relative;
      transform-origin: top center;
      animation: scrollUnroll 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes scrollUnroll {
      0% {
        opacity: 0;
        transform: scaleY(0.18) translateY(-18px);
      }
      100% {
        opacity: 1;
        transform: scaleY(1) translateY(0);
      }
    }

    .scroll-roller {
      height: 12px;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #78350f, #d97706, #fef3c7, #d97706, #78350f);
      border: 1px solid #451a03;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .scroll-roller.top {
      margin-bottom: 14px;
    }

    .scroll-roller.bottom {
      margin-top: 14px;
    }

    .scroll-badge {
      display: inline-block;
      background: rgba(146, 64, 14, 0.14);
      border: 1px solid rgba(146, 64, 14, 0.35);
      color: #78350f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .scroll-title {
      font-size: 21px;
      font-weight: 900;
      color: #7c2d12;
      margin-bottom: 14px;
    }

    .couple-photo-box {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .couple-photo-box img {
      width: 100%;
      max-width: 320px;
      height: 175px;
      border-radius: 16px;
      object-fit: cover;
      border: 3px solid #b45309;
      background: #e2e8f0;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .wish-letter {
      background: rgba(255, 251, 235, 0.78);
      border: 1px dashed rgba(146, 64, 14, 0.45);
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      font-size: 14px;
      line-height: 1.75;
      color: #2c1810;
      white-space: pre-line;
      max-height: 210px;
      overflow-y: auto;
      user-select: text;
    }

    .action-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      border: none;
      border-radius: 13px;
      padding: 13px 26px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.3);
    }

    .scroll-action-btn {
      background: linear-gradient(135deg, #9a3412, #7c2d12);
      color: #fef3c7;
      border: none;
      border-radius: 13px;
      padding: 12px 24px;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 6px 16px rgba(124, 45, 18, 0.35);
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">Journey</span>
        <span class="hud-val"><span id="daysDisplay">0</span> / 1000d</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Streak</span>
        <span class="hud-val streak-val" id="streakDisplay">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Speed</span>
        <span class="hud-val speed-val" id="speedDisplay">1.0x</span>
      </div>
    </div>

    <div class="status-banner">
      <span id="milestoneText">Tap JUMP or Canvas to leap over pots & collect gifts!</span>
      <span id="shieldPill" class="shield-pill">🛡️ SHIELD READY</span>
    </div>

    <canvas id="gameCanvas" width="520" height="365"></canvas>

    <div class="controls">
      <button id="startBtn" class="main-btn start-btn">START JOURNEY</button>
      <button id="jumpBtn" class="main-btn jump-btn" style="display: none;">JUMP</button>
    </div>
  </div>

  <!-- GAME OVER / WIN MODAL -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="standardModalCard" class="modal-card">
      <div id="modalTitle" class="modal-title">1000 Days Anniversary</div>
      <div id="modalText" class="modal-text">You reached the goal! Happy 1000 Days Anniversary!</div>
      <button id="restartBtn" class="action-btn">Play Again</button>
    </div>

    <div id="scrollModalCard" class="scroll-card" style="display: none;">
      <div class="scroll-roller top"></div>
      <div class="scroll-badge">1000 Days Milestone Scroll</div>
      <div id="scrollTitle" class="scroll-title">Happy 1000 Days Together</div>

      <div class="couple-photo-box">
        <img id="scrollCoupleImg" src="" alt="Together" />
      </div>

      <div id="wishLetterBox" class="wish-letter"></div>

      <button id="scrollRestartBtn" class="scroll-action-btn">Play Again</button>
      <div class="scroll-roller bottom"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const daysDisplay = document.getElementById("daysDisplay");
    const streakDisplay = document.getElementById("streakDisplay");
    const speedDisplay = document.getElementById("speedDisplay");
    const milestoneText = document.getElementById("milestoneText");
    const shieldPill = document.getElementById("shieldPill");
    const startBtn = document.getElementById("startBtn");
    const jumpBtn = document.getElementById("jumpBtn");
    const modalOverlay = document.getElementById("modalOverlay");
    const standardModalCard = document.getElementById("standardModalCard");
    const scrollModalCard = document.getElementById("scrollModalCard");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");
    const restartBtn = document.getElementById("restartBtn");
    const scrollRestartBtn = document.getElementById("scrollRestartBtn");
    const scrollCoupleImg = document.getElementById("scrollCoupleImg");
    const wishLetterBox = document.getElementById("wishLetterBox");

    const GOAL_DAYS = 1000;
    const BASE_STEP_DAYS = 10;
    const groundY = 296;

    const BOY_IMAGE_URL = "https://i.imgur.com/DuXWXBR.jpeg";
    const GIRL_IMAGE_URL = "https://i.imgur.com/MqExQ7E.jpeg";

    // Single couple photo URL for the 1000-day milestone scroll
    const COUPLE_SCROLL_IMAGE_URL = "https://i.imgur.com/3Vhdhmu.png";

    // Personal anniversary wishes
    const ANNIVERSARY_WISH_TEXT = `ရက် ၁၀၀၀ ပြည့် အမှတ်တရ ဆုတောင်းစာ —

ဒီခရီးလေးတစ်လျှောက် အတူရှိပေးခဲ့တဲ့အတွက် ကျေးဇူးအများကြီးတင်ပါတယ်။
နောင်လာမယ့် ရက်တွေ၊ လတွေ၊ နှစ်တွေမှာလည်း ကျန်းမာပျော်ရွှင်ပြီး
အမြဲတမ်း အတူတူ လက်တွဲလျှောက်လှမ်းသွားနိုင်ပါစေလို့ ဆုတောင်းလိုက်ပါတယ်။`;

    const runnerImg = new Image();
    const partnerImg = new Image();
    runnerImg.crossOrigin = "anonymous";
    partnerImg.crossOrigin = "anonymous";

    let isRunnerLoaded = false;
    let isPartnerLoaded = false;

    if (BOY_IMAGE_URL.trim()) {
      runnerImg.onload = () => {
        isRunnerLoaded = true;
        draw();
      };
      runnerImg.src = BOY_IMAGE_URL.trim();
    }

    if (GIRL_IMAGE_URL.trim()) {
      partnerImg.onload = () => {
        isPartnerLoaded = true;
        draw();
      };
      partnerImg.src = GIRL_IMAGE_URL.trim();
    }

    if (COUPLE_SCROLL_IMAGE_URL.trim()) {
      scrollCoupleImg.src = COUPLE_SCROLL_IMAGE_URL.trim();
    }

    const runner = {
      x: 76,
      y: groundY,
      vy: 0,
      gravity: 0.76,
      jumpPower: -14.6,
      isGrounded: true,
      jumpsUsed: 0,
      maxJumps: 2,
      hasShield: false
    };

    const partner = {
      x: canvas.width - 66,
      y: groundY
    };

    const clouds = [
      { x: 65, y: 68, scale: 1.0, speed: 0.35 },
      { x: 245, y: 48, scale: 1.2, speed: 0.25 },
      { x: 420, y: 82, scale: 0.9, speed: 0.42 }
    ];

    const stars = Array.from({ length: 22 }, (_, i) => ({
      x: ((i * 73) % (canvas.width - 20)) + 10,
      y: ((i * 37) % 120) + 28,
      r: (i % 2) + 1.2,
      phase: i * 0.7
    }));

    const gardenItems = Array.from({ length: 30 }, (_, i) => ({
      x: (i * 22) % (canvas.width + 44),
      isBush: i % 4 === 0,
      height: 5 + (i % 5)
    }));

    let obstacles = [];
    let powerups = [];
    let particles = [];
    let floatingTexts = [];

    let days = 0;
    let streak = 0;
    let baseSpeed = 4.8;
    let currentSpeed = 4.8;
    let spawnTimer = 52;
    let powerupTimer = 140;
    let lastMilestone = 0;
    let tickCount = 0;
    let isRunning = false;
    let animId = null;

    const MILESTONES = [
      { day: 100, msg: "Day 100: First 100 days of memories unlocked!" },
      { day: 250, msg: "Day 250: Quarter way to 1000 days — keep going!" },
      { day: 500, msg: "Day 500: Halfway milestone! Golden sunset skies!" },
      { day: 750, msg: "Day 750: Twilight rush! Almost at the finish!" },
      { day: 1000, msg: "Day 1000: Anniversary scroll unlocked!" }
    ];

    function updateSpeedScaling() {
      const progressRatio = Math.min(days / GOAL_DAYS, 1);
      currentSpeed = +(baseSpeed + progressRatio * 3.1).toFixed(2);
      const mult = (currentSpeed / baseSpeed).toFixed(1);
      speedDisplay.textContent = `${mult}x`;
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, alpha: 1, vy: -1.3 });
    }

    function spawnBurst(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const spd = 1.5 + Math.random() * 2.6;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 1.2,
          life: 1,
          color,
          size: 3 + Math.random() * 2.5
        });
      }
    }

    function startGame() {
      if (isRunning) return;
      isRunning = true;
      startBtn.style.display = "none";
      jumpBtn.style.display = "block";
      loop();
    }

    function jump() {
      if (!isRunning) return;
      if (runner.jumpsUsed < runner.maxJumps) {
        runner.vy = runner.jumpsUsed === 0 ? runner.jumpPower : runner.jumpPower * 0.88;
        runner.isGrounded = false;
        runner.jumpsUsed++;
        spawnBurst(runner.x, runner.y - 6, runner.jumpsUsed === 2 ? "#38bdf8" : "#fbbf24", 7);
      }
    }

    startBtn.addEventListener("click", startGame);

    jumpBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      jump();
    });

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!isRunning) return;
      jump();
    });

    function spawnObstacle() {
      const tallChance = days >= 200 ? 0.38 : 0.2;
      const isTall = Math.random() < tallChance;
      const w = isTall ? 28 + Math.floor(Math.random() * 6) : 24 + Math.floor(Math.random() * 8);
      const h = isTall ? 40 + Math.floor(Math.random() * 10) : 27 + Math.floor(Math.random() * 10);

      obstacles.push({
        x: canvas.width + 14,
        y: groundY - h,
        w,
        h,
        isTall,
        passed: false
      });
    }

    function spawnPowerup() {
      const types = ["shield", "boost", "heart"];
      const type = types[Math.floor(Math.random() * types.length)];
      const altY = groundY - (52 + Math.floor(Math.random() * 44));
      powerups.push({
        x: canvas.width + 16,
        y: altY,
        r: 13,
        type,
        collected: false
      });
    }

    function checkMilestones() {
      for (const m of MILESTONES) {
        if (days >= m.day && lastMilestone < m.day) {
          lastMilestone = m.day;
          milestoneText.textContent = m.msg;
          spawnBurst(runner.x + 20, runner.y - 45, "#fbbf24", 16);
        }
      }
    }

    function drawGroundShadow(x, radiusX, heightAboveGround) {
      const heightRatio = Math.max(0.32, 1 - heightAboveGround / 150);
      ctx.save();
      ctx.fillStyle = "rgba(2, 6, 23, 0.34)";
      ctx.beginPath();
      ctx.ellipse(x, groundY + 2, radiusX * heightRatio, 5 * heightRatio, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFlowerPotObstacle(obs) {
      ctx.save();
      drawGroundShadow(obs.x + obs.w * 0.5, obs.w * 0.55, 0);

      const potTopY = obs.y + (obs.isTall ? 16 : 11);

      ctx.strokeStyle = "#4d7c0f";
      ctx.lineWidth = 2.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w * 0.5, potTopY);
      ctx.lineTo(obs.x + obs.w * 0.5, obs.y + 3);
      ctx.moveTo(obs.x + obs.w * 0.5, potTopY - 4);
      ctx.lineTo(obs.x + obs.w * 0.2, obs.y + 5);
      ctx.moveTo(obs.x + obs.w * 0.5, potTopY - 4);
      ctx.lineTo(obs.x + obs.w * 0.8, obs.y + 5);
      ctx.stroke();

      ctx.fillStyle = "#65a30d";
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.w * 0.2, obs.y + 5, 4.5, 2.5, -0.5, 0, Math.PI * 2);
      ctx.ellipse(obs.x + obs.w * 0.8, obs.y + 5, 4.5, 2.5, 0.5, 0, Math.PI * 2);
      ctx.fill();

      const potGrad = ctx.createLinearGradient(obs.x, potTopY, obs.x + obs.w, groundY);
      potGrad.addColorStop(0, obs.isTall ? "#dc2626" : "#c2410c");
      potGrad.addColorStop(1, obs.isTall ? "#7f1d1d" : "#78350f");
      ctx.fillStyle = potGrad;
      ctx.beginPath();
      ctx.moveTo(obs.x + 3, potTopY);
      ctx.lineTo(obs.x + obs.w - 3, potTopY);
      ctx.lineTo(obs.x + obs.w - 6, groundY);
      ctx.lineTo(obs.x + 6, groundY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = obs.isTall ? "#991b1b" : "#92400e";
      ctx.beginPath();
      ctx.roundRect(obs.x + 1, potTopY - 2, obs.w - 2, 6, 2.5);
      ctx.fill();
      ctx.restore();
    }

    function drawPowerup(p) {
      ctx.save();
      const pulse = Math.sin(tickCount * 0.12) * 2.5;
      ctx.translate(p.x, p.y + pulse);

      let bg = "#38bdf8";
      let icon = "🛡️";
      if (p.type === "boost") {
        bg = "#facc15";
        icon = "⚡";
      } else if (p.type === "heart") {
        bg = "#fb7185";
        icon = "💖";
      }

      ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
      ctx.beginPath();
      ctx.arc(0, 0, p.r + 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = bg;
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.font = "14px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(icon, 0, 1);
      ctx.restore();
    }

    function drawBackground() {
      const p = Math.min(days / GOAL_DAYS, 1);
      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);

      if (p < 0.5) {
        skyGrad.addColorStop(0, "#1e293b");
        skyGrad.addColorStop(0.55, "#8b5e58");
        skyGrad.addColorStop(1, "#e2c7a8");
      } else {
        skyGrad.addColorStop(0, "#0f172a");
        skyGrad.addColorStop(0.55, "#581c87");
        skyGrad.addColorStop(1, "#f59e0b");
      }

      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, groundY);

      for (const s of stars) {
        const twinkle = 0.25 + 0.55 * Math.abs(Math.sin(tickCount * 0.04 + s.phase));
        ctx.fillStyle = `rgba(254, 249, 195, ${twinkle * (0.4 + p * 0.6)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      const sunX = 395;
      const sunY = 105 - p * 22;
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 82);
      sunGlow.addColorStop(0, "rgba(254, 243, 199, 0.72)");
      sunGlow.addColorStop(1, "rgba(254, 243, 199, 0)");
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 82, 0, Math.PI * 2);
      ctx.fill();

      for (const c of clouds) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.fillStyle = "rgba(248, 250, 252, 0.34)";
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.arc(15, -4, 18, 0, Math.PI * 2);
        ctx.arc(30, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const lawnGrad = ctx.createLinearGradient(0, groundY, 0, groundY + 26);
      lawnGrad.addColorStop(0, "#4d7c0f");
      lawnGrad.addColorStop(1, "#365314");
      ctx.fillStyle = lawnGrad;
      ctx.fillRect(0, groundY, canvas.width, 26);

      const soilGrad = ctx.createLinearGradient(0, groundY + 26, 0, canvas.height);
      soilGrad.addColorStop(0, "#573924");
      soilGrad.addColorStop(1, "#1e120a");
      ctx.fillStyle = soilGrad;
      ctx.fillRect(0, groundY + 26, canvas.width, canvas.height - (groundY + 26));

      ctx.strokeStyle = "#65a30d";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      for (const item of gardenItems) {
        if (item.isBush) {
          ctx.fillStyle = "#3f6212";
          ctx.beginPath();
          ctx.arc(item.x, groundY + 13, 6.5, Math.PI, 0);
          ctx.fill();
        } else {
          ctx.strokeStyle = "#84cc16";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(item.x, groundY);
          ctx.lineTo(item.x - 2.5, groundY - item.height);
          ctx.moveTo(item.x, groundY);
          ctx.lineTo(item.x + 2, groundY - item.height + 1);
          ctx.stroke();
        }
      }
    }

    function drawCharacter(x, groundPos, img, isLoaded, ringColor, label, showShield = false) {
      const heightAboveGround = Math.max(0, groundPos - runner.y);
      const centerY = groundPos - 24;

      drawGroundShadow(x, 21, label === "You" ? heightAboveGround : 0);

      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
      ctx.shadowBlur = 9;
      ctx.shadowOffsetY = 3;

      ctx.strokeStyle = ringColor;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.arc(x, centerY, 22, 0, Math.PI * 2);
      ctx.stroke();

      ctx.shadowColor = "transparent";
      ctx.beginPath();
      ctx.arc(x, centerY, 20.5, 0, Math.PI * 2);
      ctx.clip();

      if (isLoaded) {
        ctx.drawImage(img, x - 22, centerY - 22, 44, 44);
      } else {
        ctx.fillStyle = "#475569";
        ctx.fillRect(x - 22, centerY - 22, 44, 44);
      }
      ctx.restore();

      if (showShield) {
        ctx.save();
        ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(x, centerY, 27, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.fillStyle = "#f8fafc";
      ctx.font = "700 11.5px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
      ctx.shadowBlur = 4;
      ctx.fillText(label, x, centerY - 30);
      ctx.restore();
    }

    function drawGoalFlag() {
      const flagX = partner.x + 26;
      ctx.save();
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(flagX, groundY);
      ctx.lineTo(flagX, groundY - 64);
      ctx.stroke();

      ctx.fillStyle = "#f43f5e";
      ctx.beginPath();
      ctx.moveTo(flagX, groundY - 64);
      ctx.lineTo(flagX + 23, groundY - 55);
      ctx.lineTo(flagX, groundY - 46);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawProgressBar() {
      const barX = 18;
      const barY = 18;
      const barW = canvas.width - 36;
      const barH = 9;
      const ratio = Math.min(days / GOAL_DAYS, 1);

      ctx.save();
      ctx.fillStyle = "rgba(15, 23, 42, 0.55)";
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, barH, 5);
      ctx.fill();

      const grad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
      grad.addColorStop(0, "#fbbf24");
      grad.addColorStop(1, "#f97316");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW * ratio, barH, 5);
      ctx.fill();

      ctx.fillStyle = "#f8fafc";
      ctx.font = "700 11.5px system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
      ctx.shadowBlur = 3;
      ctx.fillText(`${days} / ${GOAL_DAYS} Days`, barX + barW, barY + 23);
      ctx.restore();
    }

    function drawEffects() {
      for (const pt of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.font = "800 13px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
        ctx.shadowBlur = 4;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }
    }

    function update() {
      if (!isRunning) return;
      tickCount++;
      updateSpeedScaling();

      for (const c of clouds) {
        c.x -= c.speed;
        if (c.x < -60) {
          c.x = canvas.width + 35;
        }
      }

      for (const item of gardenItems) {
        item.x -= currentSpeed * 0.78;
        if (item.x < -16) {
          item.x = canvas.width + 20;
        }
      }

      runner.vy += runner.gravity;
      runner.y += runner.vy;
      if (runner.y >= groundY) {
        runner.y = groundY;
        runner.vy = 0;
        runner.isGrounded = true;
        runner.jumpsUsed = 0;
      }

      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnObstacle();
        const minGap = Math.max(46, 74 - Math.floor((days / GOAL_DAYS) * 24));
        spawnTimer = minGap + Math.floor(Math.random() * 38);
      }

      powerupTimer--;
      if (powerupTimer <= 0) {
        spawnPowerup();
        powerupTimer = 175 + Math.floor(Math.random() * 95);
      }

      const runnerCenterX = runner.x;
      const runnerCenterY = runner.y - 24;

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.x -= currentSpeed * 0.92;

        const dx = runnerCenterX - p.x;
        const dy = runnerCenterY - p.y;
        if ((dx * dx) + (dy * dy) < Math.pow(p.r + 20, 2)) {
          if (p.type === "shield") {
            runner.hasShield = true;
            shieldPill.classList.add("active");
            addFloatingText("SHIELD!", p.x, p.y - 10, "#38bdf8");
            spawnBurst(p.x, p.y, "#38bdf8", 10);
          } else if (p.type === "boost") {
            days = Math.min(days + 20, GOAL_DAYS);
            daysDisplay.textContent = days;
            addFloatingText("+20 DAYS!", p.x, p.y - 10, "#facc15");
            spawnBurst(p.x, p.y, "#facc15", 10);
            checkMilestones();
          } else if (p.type === "heart") {
            streak += 2;
            streakDisplay.textContent = streak;
            days = Math.min(days + 10, GOAL_DAYS);
            daysDisplay.textContent = days;
            addFloatingText("+10d & +2 STREAK", p.x, p.y - 10, "#fb7185");
            spawnBurst(p.x, p.y, "#fb7185", 10);
            checkMilestones();
          }
          powerups.splice(i, 1);

          if (days >= GOAL_DAYS) {
            winGame();
            return;
          }
          continue;
        }

        if (p.x < -30) {
          powerups.splice(i, 1);
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= currentSpeed;

        if (!obs.passed && obs.x + obs.w < runner.x - 12) {
          obs.passed = true;
          streak++;
          streakDisplay.textContent = streak;

          const bonus = streak >= 5 ? 5 : 0;
          const gain = BASE_STEP_DAYS + bonus;
          days = Math.min(days + gain, GOAL_DAYS);
          daysDisplay.textContent = days;
          addFloatingText(bonus > 0 ? `+${gain}d (STREAK!)` : `+${gain}d`, runner.x, runner.y - 54, "#4ade80");
          checkMilestones();

          if (days >= GOAL_DAYS) {
            winGame();
            return;
          }
        }

        const closestX = Math.max(obs.x, Math.min(runnerCenterX, obs.x + obs.w));
        const closestY = Math.max(obs.y, Math.min(runnerCenterY, obs.y + obs.h));
        const dx = runnerCenterX - closestX;
        const dy = runnerCenterY - closestY;

        if ((dx * dx) + (dy * dy) < (17 * 17)) {
          if (runner.hasShield) {
            runner.hasShield = false;
            shieldPill.classList.remove("active");
            spawnBurst(obs.x + obs.w * 0.5, obs.y + 10, "#38bdf8", 14);
            addFloatingText("SHIELD BLOCKED!", obs.x, obs.y - 8, "#38bdf8");
            obstacles.splice(i, 1);
            continue;
          } else {
            loseGame();
            return;
          }
        }

        if (obs.x + obs.w < -25) {
          obstacles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.08;
        pt.life -= 0.035;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.022;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawProgressBar();
      drawGoalFlag();
      drawCharacter(partner.x, partner.y, partnerImg, isPartnerLoaded, "#fda4af", "Goal", false);

      for (const p of powerups) {
        drawPowerup(p);
      }

      for (const obs of obstacles) {
        drawFlowerPotObstacle(obs);
      }

      drawCharacter(runner.x, runner.y, runnerImg, isRunnerLoaded, "#fbbf24", "You", runner.hasShield);
      drawEffects();
    }

    function loop() {
      update();
      draw();
      if (isRunning) {
        animId = requestAnimationFrame(loop);
      }
    }

    function loseGame() {
      isRunning = false;
      cancelAnimationFrame(animId);
      scrollModalCard.style.display = "none";
      standardModalCard.style.display = "block";
      modalTitle.textContent = "Journey Paused";
      modalText.textContent = `You reached ${days} Days with a ${streak} streak. Watch out for tall pots and grab shields!`;
      restartBtn.textContent = "Try Again";
      modalOverlay.classList.add("show");
    }

    function winGame() {
      isRunning = false;
      cancelAnimationFrame(animId);
      days = GOAL_DAYS;
      daysDisplay.textContent = GOAL_DAYS;
      draw();

      standardModalCard.style.display = "none";
      scrollModalCard.style.display = "block";
      wishLetterBox.textContent = ANNIVERSARY_WISH_TEXT;
      modalOverlay.classList.add("show");
    }

    function resetGame() {
      modalOverlay.classList.remove("show");
      scrollModalCard.style.display = "none";
      standardModalCard.style.display = "block";
      obstacles = [];
      powerups = [];
      particles = [];
      floatingTexts = [];
      days = 0;
      streak = 0;
      lastMilestone = 0;
      tickCount = 0;
      daysDisplay.textContent = "0";
      streakDisplay.textContent = "0";
      speedDisplay.textContent = "1.0x";
      milestoneText.textContent = "Tap JUMP or Canvas to leap over pots & collect gifts!";
      shieldPill.classList.remove("active");
      spawnTimer = 52;
      powerupTimer = 140;
      runner.y = groundY;
      runner.vy = 0;
      runner.isGrounded = true;
      runner.jumpsUsed = 0;
      runner.hasShield = false;
      isRunning = false;
      startBtn.style.display = "block";
      jumpBtn.style.display = "none";
      updateSpeedScaling();
      draw();
    }

    restartBtn.addEventListener("click", resetGame);
    scrollRestartBtn.addEventListener("click", resetGame);

    updateSpeedScaling();
    draw();
  </script>
</body>
</html>
